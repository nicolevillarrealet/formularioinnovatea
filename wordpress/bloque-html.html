<!--
  INNOVATEA — qué pegar en WordPress.

  1. Edite la página donde va la encuesta.
  2. Agregue un bloque "HTML personalizado".
  3. Pegue la línea de abajo. Es todo: una sola etiqueta.
  4. Publique.

  El formulario aparece exactamente donde esté el bloque. No hace falta
  plugin, ni FTP, ni subir archivos: la etiqueta carga el controlador, y el
  controlador carga por su cuenta los estilos y los demás módulos.

  POR QUÉ LLEVA UN NÚMERO DE VERSIÓN Y NO @main
  jsDelivr le dice al navegador que guarde estos archivos durante 7 días.
  Con @main, una corrección tardaría hasta una semana en llegarle a quien
  ya hubiera abierto la página, y purgar la caché de jsDelivr no limpia la
  del visitante. Con una etiqueta, cada publicación es una dirección
  distinta: el cambio se ve de inmediato y nadie se queda con la versión
  vieja.

  PARA PUBLICAR UN CAMBIO
  1. git tag v1.0.1 && git push origin v1.0.1
  2. Cambie el número en esta línea dentro de WordPress.

  (@main sirve para pruebas, pero no debe quedar en producción.)
-->

<script type="module" src="https://cdn.jsdelivr.net/gh/transformaciondigital2026/formularioinnovatea@v1.0.0/main.js"></script>
